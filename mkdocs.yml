site_name: ragcheck
site_description: Benchmark and regression-test RAG pipelines.
site_author: Joshua Kumar
repo_url: https://github.com/Josh2106/ragcheck
repo_name: Josh2106/ragcheck
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Metrics: metrics.md
  - CI regression gate: ci.md
  - Extending: extending.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options: {show_source: false, docstring_style: sphinx}
